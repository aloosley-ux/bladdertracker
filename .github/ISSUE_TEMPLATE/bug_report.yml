name: Bug report
description: Report a reproducible problem in the app, docs, or deployment flow
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to improve BladderTracker.
        Please provide enough detail for someone new to the issue to reproduce and verify it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in one or two clear sentences.
      placeholder: When I open Reports in cloud mode, the chart area stays blank after selecting a child.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be specific so another contributor can follow the same path.
      placeholder: |
        1. Sign in as...
        2. Go to...
        3. Select...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: The chart should render the selected child's data.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: The page renders, but the chart area is empty and no fallback message appears.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Where does this happen?
      options:
        - Local / offline mode
        - Cloud mode
        - Both
        - Documentation / GitHub only
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share anything relevant about device, browser, OS, and app state.
      placeholder: |
        - Browser:
        - Device:
        - OS:
        - Branch / commit:
        - User role:

  - type: textarea
    id: impact
    attributes:
      label: Why this matters
      description: Explain the user impact, not just the technical symptom.
      placeholder: This blocks report review before school handovers and makes trend data unavailable.

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or extra context
      description: Paste console output, stack traces, or screenshots if safe to share.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed or anonymised any sensitive child or account data.
          required: true
